<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zubin Ray</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f2ed;
      --text: #1a1a18;
      --muted: #6b6860;
      --accent: #2e2e2c;
      --line: rgba(0,0,0,0.1);
    }

    html, body {
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    main {
      max-width: 480px;
      width: 100%;
    }

    .eyebrow {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1.25rem;
    }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2.8rem, 8vw, 4rem);
      font-weight: 400;
      line-height: 1.05;
      letter-spacing: -0.01em;
      color: var(--text);
      margin-bottom: 1.75rem;
    }

    h1 em {
      font-style: italic;
      color: var(--muted);
    }

    .divider {
      width: 32px;
      height: 1px;
      background: var(--line);
      margin-bottom: 1.75rem;
    }

    .bio {
      font-size: 14px;
      line-height: 1.8;
      color: var(--muted);
      font-weight: 300;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.6s ease forwards;
    }

    .fade-in:nth-child(2) { animation-delay: 0.1s; }
    .fade-in:nth-child(3) { animation-delay: 0.2s; }
    .fade-in:nth-child(4) { animation-delay: 0.3s; }
    .fade-in:nth-child(5) { animation-delay: 0.4s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow fade-in">zubinray.com</p>
    <h1 class="fade-in">Zubin<br /><em>Ray</em></h1>
    <div class="divider fade-in"></div>
    <p class="bio fade-in">Founder, tinkerer, product manager by trade.<br />Mostly experimenting and building stuff with AI.</p>
  </main>
</body>
</html>
